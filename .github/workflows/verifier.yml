name: Vérifier les liens et régénérer les fiches

on:
  schedule:
    - cron: "0 6 1 * *"   # le 1er de chaque mois
  workflow_dispatch:
  push:
    paths:
      - "data/outils.json"
      - "data/rayons.json"
      - "skills/**"
      - "scripts/pages.py"
      - ".github/workflows/verifier.yml"

permissions:
  contents: write

# Une seule vérification à la fois : la plus récente remplace celle en attente.
concurrency:
  group: verifier
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les liens, images et logos
        run: python3 scripts/enrich.py
      - name: Générer les pages de partage
        run: python3 scripts/pages.py
      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/medias.json data/liens-en-echec.txt outil llms.txt llms-full.txt skills/chercher-library.zip
          git diff --cached --quiet || git commit -m "Vérification automatique des liens et des fiches"
          # Un commit a pu arriver pendant la vérification : on se replace dessus avant de pousser.
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1

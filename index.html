<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI library — outils, API, agents et skills</title>
  <meta name="description" content="Bibliothèque triable d'outils tech, design et agents IA, d'API et d'hébergements, avec les offres gratuites et étudiantes.">
  <meta property="og:title" content="AI library">
  <meta property="og:description" content="Outils, API, hébergements, agents, skills et lectures, rangés en 8 rayons, avec les offres gratuites et étudiantes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202611190136">
</head>
<body>
  <header class="hero">
    <div class="top">
      <h1 class="plate"><a href="#" id="home"><span class="plate-ai">AI</span> library</a></h1>
      <nav class="links" aria-label="Liens du projet">
        <a href="https://github.com/Oradixx/AI-library">Code source</a>
        <span id="maj"></span>
      </nav>
    </div>
    <nav id="shelf" class="shelf" aria-label="Rayons"></nav>
  </header>

  <section class="toolbar" aria-label="Recherche et filtres">
    <div class="row">
      <label class="search">
        <span class="sr">Rechercher</span>
        <input id="q" type="search" placeholder="Rechercher un outil, un usage, un tag" autocomplete="off">
      </label>
      <div id="chips" class="chips" role="group" aria-label="Tarif"></div>
      <details class="more">
        <summary>Plus de filtres</summary>
        <div class="more-body">
          <label>Statut <select id="statut"><option value="">Tous</option></select></label>
          <label>Source <select id="source">
            <option value="">Toutes</option>
            <option value="Documents">Notes et documents</option>
            <option value="Signets X">Signets X</option>
          </select></label>
          <label>Tri <select id="tri">
            <option value="pertinence">Recommandés d'abord</option>
            <option value="nom">Par nom</option>
          </select></label>
          <label class="chk"><input id="ecartes" type="checkbox"> Afficher les écartés</label>
        </div>
      </details>
    </div>
    <p id="count" class="count" aria-live="polite"></p>
  </section>

  <main id="list"></main>

  <div id="veil" class="veil" hidden></div>
  <aside id="fiche" class="fiche" role="dialog" aria-modal="true" aria-labelledby="fiche-titre" hidden></aside>

  <button id="haut" class="haut" type="button" hidden>Revenir en haut</button>

  <footer>
    <p>Les quotas et offres gratuites changent souvent : vérifiez sur le site officiel avant de compter dessus. Les cas d'usage ont été rédigés avec une IA à partir des notes et restent à vérifier.</p>
  </footer>
  <script src="app.js?v=202611190136"></script>
</body>
</html>
